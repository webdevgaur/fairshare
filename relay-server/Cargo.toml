[package]
name = "fairshare-relay"
version = "0.1.0"
edition = "2021"
description = "Ephemeral WebSocket relay server for FairShare CRDT sync"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
http = "1"